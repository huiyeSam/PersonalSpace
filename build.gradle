buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.0.197'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'java'

version = '1.0.93-mc1.12.2'
group = 'me.eigenraven.personalspace'
archivesBaseName = 'personalspace'
tasks.withType(JavaCompile) { options.encoding = 'UTF-8' }
sourceCompatibility = targetCompatibility = '1.8'

minecraft {
    mappings channel: 'snapshot', version: '20171003-1.12'
}

processResources {
    inputs.property 'modVersion', project.version
    filesMatching('mcmod.info') {
        expand modId: 'personalspace', modName: 'Personal Dimension',
                modVersion: project.version, minecraftVersion: '1.12.2'
    }
}

repositories {
    flatDir { dirs 'libs' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2860'
    compileOnly name: 'ae2-uel-v0.56.7-dev'
    compileOnly name: 'CodeChickenLib-1.12.2-3.2.3.358-universal'
}
